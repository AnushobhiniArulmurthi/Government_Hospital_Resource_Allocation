<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Coordinator Login | GHRAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f7f3 100%);
            padding: 20px;
        }
        .login-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #0b63b6, #0fa37f);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 14px;
            box-shadow: 0 6px 14px rgba(11, 99, 182, 0.25);
        }
        .login-header h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .login-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🏥</div>
            <h2>Government Hospital System</h2>
            <p>Nalam District Central Resource Allocation Portal</p>
        </div>
        <form id="login-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="form-group" style="margin-bottom: 16px;">
                <label class="form-label" for="username">Operator / Doctor ID</label>
                <input type="text" id="username" class="form-control" value="D-001" required>
            </div>
            <div class="form-group" style="margin-bottom: 22px;">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" value="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; font-size: 14px;">
                Sign In to Portal
            </button>
            <div style="text-align: center; margin-top: 18px; font-size: 12px; color: var(--text-muted);">
                Authorized Personnel Only • Government Health Department
            </div>
        </form>
    </div>
</body>
</html>
